<!doctype html>
<!-- Gráfico animado guiado por dados: troque os números em props (data-var) ou pela IA. -->
<html data-width="1920" data-height="1080" data-fps="30" data-duration="8">
<head>
<meta charset="utf-8">
<script src="/__lm/gsap.js"></script>
<style>
  :root { --bg: #0b1020; --ink: #e8ecff; --dim: #8892b0; --bar: #4f7cff; --hi: #22d3a6; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Inter", system-ui, sans-serif; }
  .wrap { position: absolute; inset: 0; padding: 110px 140px; display: flex; flex-direction: column; }
  .eyebrow { color: var(--hi); font-weight: 700; font-size: 30px; letter-spacing: .1em; text-transform: uppercase; }
  h1 { font-size: 78px; margin: 14px 0 0; letter-spacing: -.03em; font-weight: 800; }
  .chart { flex: 1; display: flex; align-items: flex-end; gap: 46px; margin-top: 70px; border-bottom: 2px solid #ffffff22; }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .val { font-size: 46px; font-weight: 800; margin-bottom: 14px; font-variant-numeric: tabular-nums; }
  .bar { width: 100%; border-radius: 14px 14px 0 0; background: var(--bar); }
  .col:last-child .bar { background: linear-gradient(var(--hi), #0ea37f); }
  .col:last-child .val { color: var(--hi); }
  .lbl { position: absolute; bottom: -62px; font-size: 30px; color: var(--dim); font-weight: 600; }
  .col { position: relative; }
  .note { margin-top: 90px; font-size: 34px; color: var(--dim); }
  .note b { color: var(--hi); }
</style>
</head>
<body>
  <section class="clip wrap" id="grafico" data-label="Gráfico" data-start="0" data-duration="8" data-exit="fade">
    <div class="eyebrow" data-var="eyebrow">Crescimento</div>
    <h1 data-var="title">Vídeos renderizados por mês</h1>
    <div class="chart" id="chart"></div>
    <div class="note" id="note"><b data-var="highlight">+312%</b> <span data-var="note">em 5 meses, sem editar um frame à mão.</span></div>
  </section>

<script>
  // Dados: edite aqui ou passe por props: --props '{"data":"Jan:1200,Fev:2100,..."}'
  const raw = loopmotion.props.data || 'Jan:1200,Fev:2100,Mar:2900,Abr:4100,Mai:4950';
  const data = raw.split(',').map((p) => { const [k, v] = p.split(':'); return { k: k.trim(), v: +v }; });
  const max = Math.max(...data.map((d) => d.v));
  const chart = document.getElementById('chart');
  chart.innerHTML = data.map((d) => `<div class="col"><div class="val">0</div><div class="bar" style="height:${(d.v / max) * 82}%"></div><div class="lbl">${d.k}</div></div>`).join('');

  loopmotion.timeline('#grafico')
    .from('.eyebrow', { y: 30, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0.1)
    .from('h1', { y: 40, opacity: 0, duration: 0.6, ease: 'power3.out' }, 0.2)
    .from('.bar', { scaleY: 0, transformOrigin: 'bottom', stagger: 0.22, duration: 0.9, ease: 'power3.out' }, 0.8)
    .from('.lbl', { opacity: 0, y: 20, stagger: 0.22, duration: 0.4 }, 0.9)
    .from('.note', { opacity: 0, y: 30, duration: 0.6, ease: 'power3.out' }, 2.9);

  // números contando: calculados a partir do tempo (determinístico)
  const vals = [...document.querySelectorAll('.val')];
  loopmotion.onFrame((t) => { // t = tempo local à cena
    vals.forEach((el, i) => {
      const p = gsap.parseEase('power3.out')(Math.min(1, Math.max(0, (t - 0.8 - i * 0.22) / 0.9)));
      el.textContent = Math.round(data[i].v * p).toLocaleString('pt-BR');
    });
  }, '#grafico');
</script>
</body>
</html>
