<!doctype html>
<!-- data-* no <html> definem o vídeo -->
<html data-width="1920" data-height="1080" data-fps="30" data-duration="4">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0b10; }
  .center { position: absolute; inset: 0; display: grid; place-items: center; }
  h1 { color: #fff; font: 800 140px system-ui, sans-serif; margin: 0; animation: pop 1s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
</style>
</head>
<body>
  <!-- .clip + data-start/data-duration = aparece só nessa janela de tempo -->
  <section class="clip center" data-label="Título" data-start="0" data-duration="4">
    <h1 data-var="title">Olá, LoopMotion</h1>
  </section>
</body>
</html>
