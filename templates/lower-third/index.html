<!doctype html>
<!-- Lower third para entrevistas e lives. Fundo de demonstração: troque por um vídeo seu na aba Mídia. -->
<html data-width="1920" data-height="1080" data-fps="30" data-duration="6">
<head>
<meta charset="utf-8">
<script src="/__lm/gsap.js"></script>
<style>
  :root { --accent: #22d3ee; --accent2: #7c5cff; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: "Inter", system-ui, sans-serif; }
  .bg { position: absolute; inset: 0; background: radial-gradient(circle at 30% 30%, #3b3b52, #15151f 70%); }
  .bg::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, #ffffff05 0 2px, transparent 2px 120px); }
  .lt { position: absolute; left: 120px; bottom: 140px; display: flex; align-items: stretch; }
  .lt .stripe { width: 14px; background: linear-gradient(var(--accent), var(--accent2)); border-radius: 4px; }
  .lt .box { padding: 26px 46px 28px 34px; background: #0b0b12ee; backdrop-filter: blur(10px); clip-path: inset(0 0 0 0); }
  .lt .name { color: #fff; font-size: 64px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
  .lt .role { color: var(--accent); font-size: 34px; font-weight: 600; margin-top: 8px; }
  .tag { position: absolute; top: 80px; right: 100px; display: flex; gap: 14px; align-items: center; color: #fff; font: 700 30px system-ui, sans-serif; background: #e11d48; padding: 12px 26px; border-radius: 8px; letter-spacing: .08em; }
  .tag i { width: 16px; height: 16px; border-radius: 50%; background: #fff; display: block; }
</style>
</head>
<body>
  <div class="bg clip" data-label="Fundo (demonstração)" data-start="0"></div>

  <div class="tag clip" data-label="Selo AO VIVO" data-start="0.2" data-duration="5.6" data-enter="slide-left" data-exit="fade"><i id="dot"></i><span data-var="tag">AO VIVO</span></div>

  <div class="lt clip" data-label="Lower third" data-start="0.6" data-duration="5">
    <div class="stripe"></div>
    <div class="box">
      <div class="name" data-var="name">Ana Souza</div>
      <div class="role" data-var="role">CEO & Fundadora · LoopMotion</div>
    </div>
  </div>

<script>
  // tempos locais ao lower third (0 = quando ele aparece)
  loopmotion.timeline('.lt')
    .from('.lt .stripe', { scaleY: 0, transformOrigin: 'bottom', duration: 0.35, ease: 'power3.out' }, 0)
    .from('.lt .box', { clipPath: 'inset(0 100% 0 0)', duration: 0.6, ease: 'power3.inOut' }, 0.2)
    .from('.lt .name', { y: 30, opacity: 0, duration: 0.45, ease: 'power3.out' }, 0.5)
    .from('.lt .role', { y: 20, opacity: 0, duration: 0.45, ease: 'power3.out' }, 0.65)
    .to('.lt .box', { clipPath: 'inset(0 100% 0 0)', duration: 0.45, ease: 'power3.in' }, 4.4)
    .to('.lt .stripe', { scaleY: 0, transformOrigin: 'top', duration: 0.3, ease: 'power3.in' }, 4.7);
  // ponto "ao vivo" piscando: função pura do tempo
  loopmotion.onFrame((t) => { document.getElementById('dot').style.opacity = 0.35 + 0.65 * (0.5 + 0.5 * Math.cos(t * Math.PI * 2)); });
</script>
</body>
</html>
