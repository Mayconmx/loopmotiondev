<div class="clip" id="{{id}}" data-label="Fundo animado" data-start="0" style="position:absolute;inset:0;z-index:0;">
  <canvas style="position:absolute;inset:0;width:100%;height:100%;"></canvas>
  <script>
    (() => {
      const c = document.querySelector('#{{id}} canvas'); const { width: W, height: H } = loopmotion.config;
      c.width = W; c.height = H; const ctx = c.getContext('2d'); const m = Math.min(W, H);
      const dots = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: m * (0.001 + Math.random() * 0.003), s: m * (0.02 + Math.random() * 0.05), ph: Math.random() * 6.28 }));
      loopmotion.onFrame((t) => {
        ctx.clearRect(0, 0, W, H);
        const g = ctx.createRadialGradient(W / 2 + Math.sin(t * 0.6) * W * 0.15, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.6);
        g.addColorStop(0, 'rgba(124,92,255,0.30)'); g.addColorStop(0.5, 'rgba(34,211,238,0.06)'); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#fff';
        for (const d of dots) { ctx.globalAlpha = 0.25 + 0.25 * Math.sin(t * 2 + d.ph); ctx.beginPath(); ctx.arc(d.x + Math.sin(t + d.ph) * m * 0.01, (d.y - t * d.s + H) % H, d.r, 0, 6.28); ctx.fill(); }
        ctx.globalAlpha = 1;
      });
    })();
  </script>
</div>
