<div class="clip" id="{{id}}" data-label="Flash" data-start="{{start}}" data-duration="{{duration}}" style="position:absolute;inset:0;background:#fff;z-index:40;pointer-events:none;">
  <script>
    (() => { const S = '#{{id}}'; const d = Number(document.querySelector(S).dataset.duration);
      loopmotion.timeline(S).fromTo(S, { opacity: 0 }, { opacity: 1, duration: d / 2, ease: 'power2.in' }, 0).to(S, { opacity: 0, duration: d / 2, ease: 'power2.out' }, d / 2); })();
  </script>
</div>
