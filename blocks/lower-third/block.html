<div class="clip" id="{{id}}" data-label="Lower third" data-start="{{start}}" data-duration="{{duration}}" style="position:absolute;left:6vw;bottom:12vh;display:flex;align-items:stretch;">
  <div class="st" style="width:1vmin;background:var(--accent,#22d3ee);border-radius:0.4vmin;"></div>
  <div class="bx" style="padding:2.2vmin 4vmin 2.4vmin 3vmin;background:#0b0b12ee;">
    <div class="n" data-var="name" style="color:#fff;font:800 5.6vmin/1.05 system-ui,sans-serif;letter-spacing:-0.02em;">Ana Souza</div>
    <div class="r" data-var="role" style="color:var(--accent,#22d3ee);font:600 3vmin system-ui,sans-serif;margin-top:0.8vmin;">CEO · Empresa</div>
  </div>
  <script>
    (() => {
      const S = '#{{id}}'; const d = Number(document.querySelector(S).dataset.duration);
      loopmotion.timeline(S)
        .from(S + ' .st', { scaleY: 0, transformOrigin: 'bottom', duration: 0.35, ease: 'power3.out' }, 0)
        .from(S + ' .bx', { clipPath: 'inset(0 100% 0 0)', duration: 0.6, ease: 'power3.inOut' }, 0.2)
        .from(S + ' .n', { y: 20, opacity: 0, duration: 0.45, ease: 'power3.out' }, 0.5)
        .from(S + ' .r', { y: 14, opacity: 0, duration: 0.45, ease: 'power3.out' }, 0.62)
        .to(S + ' .bx', { clipPath: 'inset(0 100% 0 0)', duration: 0.45, ease: 'power3.in' }, d - 0.65)
        .to(S + ' .st', { scaleY: 0, transformOrigin: 'top', duration: 0.25, ease: 'power3.in' }, d - 0.3);
    })();
  </script>
</div>
