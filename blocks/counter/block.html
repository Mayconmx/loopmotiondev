<section class="clip" id="{{id}}" data-label="Contador" data-start="{{start}}" data-duration="{{duration}}" data-enter="fade" data-exit="fade" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
  <div class="num" data-value="12500" data-prefix="" data-suffix="+" style="color:#fff;font:900 20vmin/1 system-ui,sans-serif;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;">0</div>
  <div data-var="label" style="color:var(--accent,#22d3ee);font:700 4vmin system-ui,sans-serif;margin-top:2vmin;text-transform:uppercase;letter-spacing:0.08em;">clientes atendidos</div>
  <script>
    (() => {
      const S = '#{{id}}'; const el = document.querySelector(S + ' .num');
      const v = Number(el.dataset.value), pre = el.dataset.prefix || '', suf = el.dataset.suffix || '';
      const ease = (p) => 1 - Math.pow(1 - p, 3);
      loopmotion.onFrame((t) => {
        const p = ease(Math.min(1, Math.max(0, (t - 0.2) / 1.6)));
        el.textContent = pre + Math.round(v * p).toLocaleString('pt-BR') + (p >= 1 ? suf : '');
      }, S);
    })();
  </script>
</section>
