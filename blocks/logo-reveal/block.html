<section class="clip" id="{{id}}" data-label="Logo" data-start="{{start}}" data-duration="{{duration}}" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:3vmin;">
  <div class="ring" style="width:14vmin;height:14vmin;border-radius:50%;border:2.2vmin solid var(--accent,#7c5cff);border-right-color:var(--accent2,#22d3ee);"></div>
  <div class="nm" data-var="brand" style="color:#fff;font:800 12vmin system-ui,sans-serif;letter-spacing:-0.04em;">Marca</div>
  <script>
    (() => {
      const S = '#{{id}}'; const d = Number(document.querySelector(S).dataset.duration);
      loopmotion.timeline(S)
        .from(S + ' .ring', { scale: 0, rotation: -180, duration: 0.9, ease: 'back.out(1.6)' }, 0.05)
        .to(S + ' .ring', { rotation: 360, duration: d, ease: 'none' }, 0)
        .from(S + ' .nm', { clipPath: 'inset(0 100% 0 0)', x: -30, duration: 0.7, ease: 'power3.inOut' }, 0.45)
        .to(S, { scale: 1.08, opacity: 0, duration: 0.4, ease: 'power2.in' }, d - 0.4);
    })();
  </script>
</section>
